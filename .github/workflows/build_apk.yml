name: Build DM Life Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Shell and Permissions
        run: |
          flutter create --platforms=android --org com.dmlife .
          sed -i 's/minSdkVersion .*/minSdkVersion 23/' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 23/' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 23/' android/app/build.gradle.kts || true
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>' android/app/src/main/AndroidManifest.xml

      - name: Resolve Dependencies
        run: flutter pub get

      - name: Compile Release APK
        run: flutter build apk --release

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: dm-life-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
